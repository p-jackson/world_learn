[package]
name = "world_learn"
version = "0.1.0"
authors = ["Philip Jackson <p-jackson@live.com>"]
edition = "2021"
license = "GPL-2.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
dioxus = { version = "0.7.10", features = ["router"] }
fsrs = "6"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Web-only persistence backend (localStorage). Pulled in by the `web` feature; a
# native/iOS build never compiles it. Version tracks the `web-sys` dioxus-web
# already resolves.
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage"] }

[features]
default = ["mobile"]
web = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"

# Error reporting (issue 23). Native/iOS only: web is a dev target and the
# default sentry transport does not build for wasm, so it is scoped out of the
# wasm target entirely (the web gate never compiles it). `rustls` (not the
# default `native-tls`) keeps the reqwest transport cross-compiling to iOS
# without a system-TLS link. The DSN is embedded from the environment at build
# time (see `build.rs`), never committed. `sentry-tracing` turns the `error!`
# events we already emit at the app boundary into Sentry events.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sentry = { version = "0.49", default-features = false, features = [
    "anyhow",
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.49"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web target extras. `dx serve --web` compiles to wasm32; two transitive deps need
# browser-specific backends there (native/iOS builds pull neither):
#   - fsrs → rand → getrandom: the `wasm_js` feature provides the browser RNG
#     backend, selected by the `getrandom_backend="wasm_js"` cfg in
#     `.cargo/config.toml`. Both are required to link.
#   - jiff: `Zoned::now()` (via `session::today_local`) panics on wasm without the
#     `js` feature, which reads the clock through `js-sys`.
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
jiff = { version = "0.2", features = ["js"] }

# Stricter-than-default lint gate. CI runs clippy with `-D warnings`, so every
# lint below fails the build. `priority = -1` lets the group be a baseline that
# individual lints can still override.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# False positive: fires inside the `asset!` macro expansion (Dioxus-generated
# code we don't own), not on any code we write.
volatile_composites = "allow"
