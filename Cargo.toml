[package]
name = "world_learn"
version = "0.1.0"
authors = ["Philip Jackson <p-jackson@live.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
dioxus = { version = "0.7.1", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"

# Stricter-than-default lint gate. CI runs clippy with `-D warnings`, so every
# lint below fails the build. `priority = -1` lets the group be a baseline that
# individual lints can still override.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# False positive: fires inside the `asset!` macro expansion (Dioxus-generated
# code we don't own), not on any code we write.
volatile_composites = "allow"
